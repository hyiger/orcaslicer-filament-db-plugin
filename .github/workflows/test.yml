# Runs the test suite on Python 3.12, the oldest version the plugin header allows (requires-python).
# The publish workflow calls this too, so a release is only uploaded once its own commit passes.
name: Tests

on:
  # Only main on push: a branch with a pull request would otherwise be tested twice per push.
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Running the tests needs nothing beyond reading the code.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pytest-cov is required, not optional: pyproject's addopts pass --cov flags that plain pytest rejects.
      # Major versions are pinned so a new release cannot quietly change what the coverage gate measures.
      # coverage is listed itself because it does the measuring, and pytest-cov leaves its upper bound open.
      - name: Install test tools
        run: python -m pip install "pytest>=9,<10" "pytest-cov>=7,<8" "coverage>=7.10.6,<8"

      # No extra flags, so pyproject's addopts (including the 100% coverage gate) apply exactly as they do locally.
      - name: Run the tests
        run: python -m pytest
